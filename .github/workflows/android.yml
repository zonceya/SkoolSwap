name: Android CI - SkoolSwap

on:
  push:
    branches:
      - develop
      - 'feature/*'
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Staging Debug APK
        run: ./gradlew assembleStagingDebug

      - name: Run Tests
        run: ./gradlew test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkoolSwap-Staging-Debug-APK
          path: app/build/outputs/apk/staging/debug/app-staging-debug.apk
